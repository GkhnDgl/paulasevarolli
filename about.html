  <script>

    /* ==========================================================
       HERKUNFT DER ABOUT-SEITE
       ========================================================== */

    const urlParams = new URLSearchParams(window.location.search);
    const from = urlParams.get('from');

    const navLeft = document.querySelector('.nav-left');


    if (from === 'stilberatung') {

      navLeft.innerHTML = `
        <a href="index.html" data-i18n="nav.home">Home</a>

        <a
          href="about.html?from=stilberatung"
          data-i18n="nav.about"
        >
          Über mich
        </a>

        <div class="nav-dropdown">

          <a
            href="stilberatung.html"
            class="nav-link-dropdown"
            data-i18n="nav.stilberatung"
          >
            Stilberatung
          </a>

          <div class="dropdown-menu">

            <a
              href="stilberatung.html#reset"
              data-i18n="services.wardrobeReset.title"
            >
              Kleiderschrank-Reset
            </a>

            <a
              href="stilberatung.html#color"
              data-i18n="services.colorConsultation.title"
            >
              Farbberatung
            </a>

            <a
              href="stilberatung.html#shopping"
              data-i18n="services.personalShopping.title"
            >
              Personal Shopping
            </a>

            <a
              href="stilberatung.html#individual"
              data-i18n="services.individualConsultation.title"
            >
              Individuelle Stilberatung
            </a>

          </div>

        </div>

        <a
          href="stilberatung_shop.html"
          data-i18n="nav.shop"
        >
          Shop
        </a>

        <a
          href="rezensionen.html"
          data-i18n="nav.reviews"
        >
          Rezensionen
        </a>
      `;


    } else if (from === 'atelier') {

      navLeft.innerHTML = `
        <a href="index.html" data-i18n="nav.home">Home</a>

        <a
          href="about.html?from=atelier"
          data-i18n="nav.about"
        >
          Über mich
        </a>

        <a
          href="atelier.html"
          data-i18n="nav.services"
        >
          Leistungen
        </a>

        <a
          href="atelier_shop.html"
          data-i18n="nav.shop"
        >
          Shop
        </a>
      `;


    } else {

      navLeft.innerHTML = `
        <a
          href="index.html"
          data-i18n="nav.home"
        >
          Home
        </a>

        <a
          href="about.html?from=index"
          data-i18n="nav.about"
        >
          Über mich
        </a>
      `;

    }


    /* ==========================================================
       AUTOMATISCHE SEITENANZAHL
       ========================================================== */

    const aboutChapter =
      document.querySelector('.about-chapter');

    const chapterNav =
      document.getElementById('chapterNav');

    const scrollToTopBtn =
      document.getElementById('scrollToTopBtn');


    let pageCount = 1;


    function calculatePages() {

      if (!aboutChapter || !chapterNav) {
        return;
      }


      /*
       * Gesamthöhe des tatsächlichen About-Inhalts.
       *
       * Beispiel:
       *
       * Inhalt = 2100 px
       * Fenster = 900 px
       *
       * 2100 / 900 = 2.33
       *
       * => 3 Seiten
       */

      const totalHeight =
        aboutChapter.scrollHeight;

      const viewportHeight =
        window.innerHeight;


      pageCount = Math.max(
        1,
        Math.ceil(totalHeight / viewportHeight)
      );


      /*
       * Punkte komplett neu aufbauen.
       */

      chapterNav.innerHTML = '';


      for (let i = 0; i < pageCount; i++) {

        const dot =
          document.createElement('div');

        dot.className = 'nav-dot';

        if (i === 0) {
          dot.classList.add('active');
        }


        dot.addEventListener('click', () => {

          const targetY =
            i * viewportHeight;

          window.scrollTo({
            top: targetY,
            behavior: 'smooth'
          });

        });


        chapterNav.appendChild(dot);

      }


      updatePage();

    }


    /* ==========================================================
       AKTUELLE SEITE ERMITTELN
       ========================================================== */

    function updatePage() {

      if (pageCount <= 0) {
        return;
      }


      const viewportHeight =
        window.innerHeight;


      const currentPage =
        Math.min(
          pageCount - 1,
          Math.round(window.scrollY / viewportHeight)
        );


      const dots =
        chapterNav.querySelectorAll('.nav-dot');


      dots.forEach((dot, index) => {

        dot.classList.toggle(
          'active',
          index === currentPage
        );

      });


      /*
       * Pfeil erst ab Seite 2 anzeigen.
       */

      if (scrollToTopBtn) {

        scrollToTopBtn.classList.toggle(
          'visible',
          currentPage > 0
        );

      }

    }


    /* ==========================================================
       SCROLL
       ========================================================== */

    window.addEventListener(
      'scroll',
      updatePage,
      { passive: true }
    );


    /* ==========================================================
       RESIZE
       ========================================================== */

    window.addEventListener(
      'resize',
      calculatePages
    );


    /* ==========================================================
       NACH OBEN
       ========================================================== */

    if (scrollToTopBtn) {

      scrollToTopBtn.addEventListener('click', () => {

        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });

      });

    }


    /* ==========================================================
       INITIALISIERUNG
       ========================================================== */

    window.addEventListener(
      'load',
      calculatePages
    );


    /*
     * Falls i18n die Texte erst nach DOMContentLoaded
     * einsetzt, danach nochmals berechnen.
     */

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        setTimeout(
          calculatePages,
          100
        );

      }
    );

  </script>
