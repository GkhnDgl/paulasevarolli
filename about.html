<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="meta.title">Über mich</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Alex+Brush&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

  <script src="js/i18n.js" defer></script>
  <script src="js/nav-loader.js" defer></script>
</head>


<body class="fixed-image-layout">

  <!-- NAVIGATION -->
  <nav class="navbar">
    <div class="nav-left"></div>
    <div class="nav-right"></div>
  </nav>

  <!-- ABOUT -->
   <section class="chapter">
    <div class="chapter-image-container">
      <img src="images/paula.jpg" alt="Paula Sevarolli" class="chapter-image">
    </div>
    
    <div class="chapter-content">
      <p class="chapter-eyebrow" data-i18n="about.eyebrow"></p>
      <h1 class="chapter-title" data-i18n="about.heading"></h1>
      <p class="chapter-text" data-i18n="about.paragraph1"></p>
      <p class="chapter-text" data-i18n="about.paragraph2"></p>
      <p class="chapter-text" data-i18n="about.paragraph3"></p>
      <p class="chapter-text" data-i18n="about.paragraph4"></p>
      <p class="chapter-text" data-i18n="about.paragraph5"></p>
      <p class="chapter-text" data-i18n="about.paragraph6"></p>
      <p class="chapter-text" data-i18n="about.paragraph7"></p>
    </div>
  </section>


  <!-- NACH OBEN -->
  <button
    type="button"
    class="nav-icon-btn scroll-to-top-btn"
    id="scrollToTopBtn"
    aria-label="Nach oben scrollen"
    title="Nach oben"
  >
    <svg
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path d="M12 7.2 5.8 13.4 7.2 14.8 12 10 16.8 14.8 18.2 13.4 12 7.2Z"/>
    </svg>
  </button>


  <!-- FOOTER -->
  <footer>
    <p data-i18n="footer"></p>
    <div class="footer-links">
      <a href="impressum.html" data-i18n="legal.footerImpressum">Impressum</a>
      <span class="divider-dot">·</span>
      <a href="datenschutz.html" data-i18n="legal.footerDatenschutz">Datenschutz</a>
    </div>
  </footer>

  <script>
    /* ==========================================================
       DYNAMISCHES LADEN DER JSON-SPRACHDATEI
       ========================================================== */

    async function renderAboutContent() {
      const lang = localStorage.getItem('lang') || 'de';
      try {
        const response = await fetch(`lang/${lang}.json`);
        const translations = await response.json();

        if (translations.about) {
          const eyebrow = document.querySelector('[data-i18n="about.eyebrow"]');
          if (eyebrow && translations.about.eyebrow) {
            eyebrow.textContent = translations.about.eyebrow;
          }

          const heading = document.querySelector('[data-i18n="about.heading"]');
          if (heading && translations.about.heading) {
            heading.textContent = translations.about.heading;
          }
          // Paragraphen 1 bis 7 dynamisch aus der JSON befüllen
          for (let i = 1; i <= 7; i++) {
            const paragraph = document.querySelector(`[data-i18n="about.paragraph${i}"]`);
            if (paragraph) {
              if (translations.about && translations.about[`paragraph${i}`]) {
                paragraph.textContent = translations.about[`paragraph${i}`];
                paragraph.style.display = 'block'; // Anzeigen, wenn Text da ist
              } else {
                paragraph.style.display = 'none';  // Ausblenden, falls kein Text vorhanden ist
              }
            }
          }
        }

      } catch (err) {
        console.error('Fehler beim Laden der Übersetzungen:', err);
      }
    }


    /* ==========================================================
       SCROLL-TO-TOP BUTTON VISIBILITY
       ========================================================== */

    const scrollToTopBtn = document.getElementById('scrollToTopBtn');

    function toggleScrollToTopBtn() {
      if (scrollToTopBtn) {
        if (window.scrollY > 150) {
          scrollToTopBtn.classList.add('visible');
        } else {
          scrollToTopBtn.classList.remove('visible');
        }
      }
    }


    /* ==========================================================
       EVENT LISTENER & INITIALISIERUNG
       ========================================================== */

    window.addEventListener('scroll', toggleScrollToTopBtn, { passive: true });

    if (scrollToTopBtn) {
      scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAboutContent();

      const langSwitcher = document.getElementById('lang-switcher');
      if (langSwitcher) {
        langSwitcher.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') {
            setTimeout(renderAboutContent, 50);
          }
        });
      }
    });

  </script>

</body>

</html>
