<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title data-i18n="meta.title"></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/nav-loader.js" defer></script>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div class="landing-logo">
    <h1>Paula Sevarolli</h1>
    <div class="logo-divider">
        <span></span>
        <div class="diamond"></div>
        <span></span>
    </div>
    <!-- <p><landing class="description" data-i18n="landing.description"></landing></p> -->
  </div>

  <nav class="navbar">
    <div class="nav-left"></div>
    <div class="nav-right"></div>
  </nav>

  <main class="landing-split" id="home">
    <a class="landing-half stilberatung" href="stilberatung.html">
      <div class="landing-half-content">
        <h2 data-i18n="landing.stilberatungTitle"></h2>
        <p data-i18n="landing.stilberatungText"></p>
        <span class="btn-small" data-i18n="landing.stilberatungCta"></span>
      </div>
    </a>
    <a class="landing-half atelier" href="atelier.html">
      <div class="landing-half-content">
        <h2 data-i18n="landing.atelierTitle"></h2>
        <p data-i18n="landing.atelierText"></p>
        <span class="btn-small" data-i18n="landing.atelierCta"></span>
      </div>
    </a>
  </main>

  <script>
    // Netlify Identity Redirect
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
