<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title data-i18n="meta.title"></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/nav-loader.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left"></div>
    <div class="nav-right"></div>
  </nav>

  <header class="page-hero">
    <div class="page-hero-content">
      <p class="eyebrow" data-i18n="legal.impressum.eyebrow"></p>
      <h1 data-i18n="legal.impressum.title"></h1>
    </div>
  </header>

  <section class="page-section">
    <a href="#" class="contact-back" id="contactBack" data-i18n="contactPage.back">
      Zurück
    </a>

    <div class="legal-content">
      <div class="legal-section">
        <h2 data-i18n="legal.impressum.section1Heading"></h2>
        <p class="legal-placeholder" data-i18n="legal.impressum.name"></p>
        <p class="legal-placeholder" data-i18n="legal.impressum.address"></p>
      </div>

      <div class="legal-section">
        <h2 data-i18n="legal.impressum.contactHeading"></h2>
        <p data-i18n="legal.impressum.email"></p>
        <p class="legal-placeholder" data-i18n="legal.impressum.phone"></p>
      </div>

      <div class="legal-section">
        <h2 data-i18n="legal.impressum.vatHeading"></h2>
        <p class="legal-placeholder" data-i18n="legal.impressum.vatText"></p>
      </div>

      <div class="legal-section">
        <h2 data-i18n="legal.impressum.responsibleHeading"></h2>
        <p class="legal-placeholder" data-i18n="legal.impressum.responsibleText"></p>
      </div>

      <div class="legal-section">
        <h2 data-i18n="legal.impressum.disputeHeading"></h2>
        <p data-i18n="legal.impressum.disputeText"></p>
      </div>
    </div>
  </section>

  <footer>
    <p data-i18n="footer"></p>
    <div class="footer-links">
      <a href="impressum.html" data-i18n="legal.footerImpressum"></a>
      <span class="divider-dot" aria-hidden="true">·</span>
      <a href="datenschutz.html" data-i18n="legal.footerDatenschutz"></a>
    </div>
  </footer>

  <script>
    function setupBackLink() {
      const backLink = document.getElementById('contactBack');
      const referrer = document.referrer;
      let target = 'index.html';

      if (referrer) {
        try {
          const refUrl = new URL(referrer);
          if (
            refUrl.origin === window.location.origin &&
            refUrl.href !== window.location.href
          ) {
            target = refUrl.href;
          }
        } catch (error) {
          // Fallback bleibt index.html.
        }
      }

      backLink.href = target;
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupBackLink();
    });
  </script>
</body>
</html>
