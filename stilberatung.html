  <style>
    /* ==========================================================================
       1. DESIGN TOKENS / CSS VARIABLEN (Harmonized with style.css & Light Theme)
       ========================================================================== */
    :root {
      /* Farben - Primär & Akzente */
      --color-primary: #8d6376;
      --color-primary-hover: #7a4d63;
      --color-text-main: #4d4a4f;
      --color-text-muted: #725b64;
      --color-text-light: #9d9198;
      --color-accent-gold: #d4af37;
      --bg-right-content: #ffffff;
      --bg-right-content-subtle: #fffafc;

      /* Gradients */
      --bg-main-gradient: linear-gradient(180deg, #fffafc 0%, #f7f3f5 100%);
      --bg-btn-gradient: linear-gradient(135deg, rgba(255, 236, 242, 0.95), rgba(233, 184, 200, 0.55));
      --bg-btn-primary: linear-gradient(135deg, #8d6376 0%, #7a4d63 100%);

      /* Schriften */
      --font-sans: 'Plus Jakarta Sans', 'Inter', sans-serif;
      --font-serif: 'Cormorant Garamond', 'Playfair Display', serif;
      --font-script: 'Alex Brush', cursive;

      /* Rahmen & Schatten */
      --border-pink: 1px solid rgba(233, 184, 200, 0.4);
      --shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 8px 20px rgba(233, 184, 200, 0.2);
      --shadow-btn-hover: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 10px 24px rgba(233, 184, 200, 0.3);
      --shadow-soft: 0 10px 30px rgba(141, 99, 118, 0.08);
    }

    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: #ffffff;
      color: var(--color-text-main);
      font-family: var(--font-sans);
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    /* Navbar Styles */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(233, 184, 200, 0.25);
      box-shadow: 0 4px 25px rgba(141, 99, 118, 0.06);
      font-family: var(--font-sans);
      font-size: 0.9rem;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .navbar a {
      color: var(--color-text-main);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.3px;
      padding: 8px 14px;
      border-radius: 999px;
      transition: all 0.3s ease;
    }

    .navbar a:hover {
      color: var(--color-primary);
      background: rgba(233, 184, 200, 0.16);
    }

    /* Dropdown */
    .nav-dropdown {
      position: relative;
    }

    .nav-link-dropdown {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link-dropdown::after {
      content: "▾";
      display: inline-block;
      font-size: 12px;
      color: var(--color-primary);
      transition: transform 0.25s ease;
    }

    .nav-dropdown:hover .nav-link-dropdown::after {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: rgba(255, 250, 252, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      min-width: 220px;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 16px 35px rgba(141, 99, 118, 0.15);
      border: 1px solid rgba(233, 184, 200, 0.3);
      flex-direction: column;
      gap: 4px;
    }

    .nav-dropdown:hover .dropdown-menu {
      display: flex;
    }

    .dropdown-menu a {
      color: var(--color-text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }

    .dropdown-menu a:hover {
      background: rgba(233, 184, 200, 0.2);
      color: var(--color-primary);
    }

    /* Elegant Social Icon Buttons */
    .nav-icon-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-btn-gradient);
      border: var(--border-pink);
      color: var(--color-primary);
      box-shadow: var(--shadow-btn);
      transition: all 0.3s ease;
      padding: 0 !important;
    }

    .nav-icon-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .nav-icon-btn:hover {
      transform: translateY(-2px);
      color: var(--color-primary-hover);
      box-shadow: var(--shadow-btn-hover);
      background: #ffffff;
    }

    .nav-icon-btn:hover svg {
      transform: scale(1.08);
    }

    /* Language Switcher */
    .lang-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: var(--border-pink);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
    }

    .lang-switch button {
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 5px 12px;
      border-radius: 999px;
      transition: all 0.3s ease;
    }

    .lang-switch button.active {
      color: var(--color-primary);
      font-weight: 600;
      background: var(--bg-btn-gradient);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 2px 8px rgba(233, 184, 200, 0.25);
    }

    /* Fullscreen Chapter Layout */
    .chapter {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row; /* Bild links, Text rechts */
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
    }

    /* Links: Bild 1/3 (33.333%) */
    .chapter-image-container {
      width: 33.333%;
      height: 100%;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .chapter-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.8s ease;
    }

    .chapter:hover .chapter-image {
      transform: scale(1.03);
    }

    /* Rechts: Text 2/3 (66.667%) - Light Background & Elegant Styling */
    .chapter-content {
      width: 66.667%;
      height: 100%;
      background-color: var(--bg-right-content);
      background: linear-gradient(135deg, #ffffff 0%, #fffafc 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6% 10% 5% 8%;
      position: relative;
    }

    .chapter-content::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, rgba(233,184,200,0) 0%, rgba(233,184,200,0.3) 50%, rgba(233,184,200,0) 100%);
    }

    /* Typografie */
    .chapter-eyebrow {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .chapter-title {
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 4vw, 4.5rem);
      font-weight: 400;
      font-style: italic;
      color: var(--color-primary);
      line-height: 1.15;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }

    .chapter-meta {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chapter-meta::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 1px;
      background-color: var(--color-primary);
    }

    .chapter-text {
      font-family: var(--font-sans);
      font-size: clamp(0.95rem, 1.05vw, 1.1rem);
      font-weight: 300;
      color: var(--color-text-main);
      line-height: 1.8;
      margin-bottom: 24px;
      max-width: 780px;
    }

    .chapter-list-label {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-primary-hover);
      margin-bottom: 12px;
      margin-top: 6px;
    }

    .chapter-list {
      list-style-type: none;
      margin-bottom: 32px;
    }

    .chapter-list li {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--color-text-main);
      line-height: 1.7;
      margin-bottom: 10px;
      position: relative;
      padding-left: 24px;
    }

    .chapter-list li::before {
      content: "✦";
      color: var(--color-primary);
      font-size: 0.75rem;
      position: absolute;
      left: 0;
      top: 1px;
    }

    /* Buttons */
    .chapter-btn-wrapper {
      margin-top: 10px;
      display: flex;
      gap: 15px;
    }

    .btn {
      display: inline-block;
      background: var(--bg-btn-gradient);
      border: var(--border-pink);
      color: var(--color-primary);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 14px 34px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: var(--shadow-btn);
      transition: all 0.3s ease;
      letter-spacing: 0.4px;
    }

    .btn:hover {
      transform: translateY(-2px);
      color: var(--color-primary-hover);
      box-shadow: var(--shadow-btn-hover);
      background: #ffffff;
    }

    /* Seiten-Navigation (Dots) */
    .chapter-nav {
      position: fixed;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 100;
    }

    .nav-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: rgba(141, 99, 118, 0.25);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-dot.active {
      background-color: var(--color-primary);
      transform: scale(1.5);
      box-shadow: 0 0 10px rgba(141, 99, 118, 0.4);
    }

    /* Responsive */
    @media (max-width: 900px) {
      body { scroll-snap-type: none; }
      .navbar { padding: 15px 20px; flex-direction: column; gap: 12px; }
      .nav-left, .nav-right { flex-wrap: wrap; justify-content: center; }
      .chapter { flex-direction: column; height: auto; min-height: 100vh; }
      .chapter-image-container { width: 100%; height: 45vh; }
      .chapter-content { width: 100%; height: auto; padding: 40px 24px 60px; }
      .chapter-nav { display: none; }
      .chapter-btn-wrapper { flex-direction: column; }
      .btn { text-align: center; }
    }
  </style>

  <!-- i18n & Scroll Script -->
  <script>
    // Chapter Dots Logic
    const chapters = document.querySelectorAll('.chapter');
    const dots = document.querySelectorAll('.nav-dot');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const index = Array.from(chapters).indexOf(entry.target);
          dots.forEach(dot => dot.classList.remove('active'));
          if (dots[index]) {
            dots[index].classList.add('active');
          }
        }
      });
    }, { threshold: 0.5 });

    chapters.forEach(chapter => observer.observe(chapter));

    // Allow clicking on dots to scroll to section
    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        chapters[index].scrollIntoView({ behavior: 'smooth' });
      });
    });

    // Translation Logic (from original files)
    let currentLang = 'de';

    function updateLanguageButtons() {
      document.querySelectorAll('.lang').forEach(button => {
        const isActive = button.getAttribute('data-lang') === currentLang;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
    }

    async function loadLanguage(lang) {
      try {
        const response = await fetch(`lang/${lang}.json`);
        const translations = await response.json();

        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          const value = key.split('.').reduce((o, i) => o?.[i], translations);

          if (value) {
            // Remove existing text nodes to replace them, keeping child elements intact if any
            const textNodes = Array.from(el.childNodes).filter(node => node.nodeType === Node.TEXT_NODE);
            textNodes.forEach(node => node.remove());
            const textNode = document.createTextNode(value);
            el.prepend(textNode);
          }
        });
      } catch (error) {
        console.error("Error loading language file:", error);
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      loadLanguage(lang);
      localStorage.setItem('lang', lang);
      updateLanguageButtons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.lang').forEach(button => {
        button.addEventListener('click', () => {
          setLanguage(button.getAttribute('data-lang'));
        });
      });

      const savedLang = localStorage.getItem('lang') || 'de';
      setLanguage(savedLang);
    });
  </script>

</body>
</html>
