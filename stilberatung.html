  <button type="button" class="nav-icon-btn scroll-to-top-btn" id="scrollToTopBtn" aria-label="Nach oben scrollen" title="Nach oben">

    </div>

  <script>
    // Chapter Dots Logic
    const chapters = document.querySelectorAll('.chapter');
    const dots = document.querySelectorAll('.nav-dot');
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');

    const updateChapterState = (index) => {
      dots.forEach(dot => dot.classList.remove('active'));
      if (dots[index]) {
        dots[index].classList.add('active');
      }

      if (scrollToTopBtn) {
        scrollToTopBtn.classList.toggle('visible', index > 0);
      }
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const index = Array.from(chapters).indexOf(entry.target);
          updateChapterState(index);
        }
      });
    }, { threshold: 0.5 });

    chapters.forEach(chapter => observer.observe(chapter));

    if (scrollToTopBtn) {
      scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        chapters[index].scrollIntoView({ behavior: 'smooth' });
      });
    });
  </script>
