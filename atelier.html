<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title data-i18n="meta.title"></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/scroll.js" defer></script>
  <script src="js/i18n.js" defer></script>
</head>
<body class="fixed-image-layout">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="atelier.html" data-i18n="nav.services">Leistungen</a>
      <a href="atelier_shop.html" data-i18n="nav.shop">Shop</a>
    </div>
    <div class="nav-right">
      <div class="nav-icon-group">
        <!-- Mail Icon -->
        <a href="contact.html" class="nav-icon-btn" aria-label="Contact Me" title="Contact Me">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </a>
        <!-- Instagram Icon -->
        <a href="https://instagram.com/paulasevarolli" target="_blank" rel="noopener noreferrer" class="nav-icon-btn" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
      </div>
      <!-- Rechtliches (Impressum, Datenschutz) -->
      <div class="nav-dropdown">
        <a href="impressum.html" class="nav-icon-btn" aria-label="Rechtliches" title="Rechtliches">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </a>
        <div class="dropdown-menu">
          <a href="impressum.html" data-i18n="legal.footerImpressum">Impressum</a>
          <a href="datenschutz.html" data-i18n="legal.footerDatenschutz">Datenschutz</a>
        </div>
      </div>
      <!-- Dynamischer Sprachumschalter -->
      <div class="lang-switch" id="lang-switcher" role="group" aria-label="Language switcher"></div>
    </div>
  </nav>

  <!-- Seiten-Navigation Dots -->
  <div class="chapter-nav">
    <div class="nav-dot active"></div>
    <div class="nav-dot"></div>
  </div>

  <section class="chapter">
    <div class="chapter-image-container">
      <img src="images/atelier.jpg" alt="Atelier" class="chapter-image">
    </div>
    <div class="chapter-content">
      <p class="chapter-eyebrow" data-i18n="atelier.eyebrow"></p>
      <h1 class="chapter-title" data-i18n="atelier.title"></h1>
      <p class="chapter-text" data-i18n="atelier.description"></p>
    </div>
  </section>

  <section class="page-section">
    <h2 data-i18n="atelier.priceListTitle"></h2>
    <table class="price-table">
      <thead>
        <tr>
          <th data-i18n="atelier.priceTableHeadService"></th>
          <th data-i18n="atelier.priceTableHeadPrice"></th>
        </tr>
      </thead>
      <tbody id="priceTableBody">
        <!-- Wird dynamisch per JavaScript befüllt -->
      </tbody>
    </table>
    <p class="price-note" data-i18n="atelier.priceListNote"></p>

    <div class="hero-actions">
      <a href="contact.html" class="btn" data-i18n="servicePages.cta">Termin vereinbaren</a>
    </div>
  </section>

  <button type="button" class="nav-icon-btn scroll-to-top-btn" id="scrollToTopBtn" aria-label="Nach oben scrollen" title="Nach oben">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 7.2 5.8 13.4 7.2 14.8 12 10 16.8 14.8 18.2 13.4 12 7.2Z"/>
    </svg>
  </button>

  <footer>
    <p data-i18n="footer"></p>
    <div class="footer-links">
      <a href="impressum.html" data-i18n="legal.footerImpressum"></a>
      <span class="divider-dot" aria-hidden="true">·</span>
      <a href="datenschutz.html" data-i18n="legal.footerDatenschutz"></a>
    </div>
  </footer>

  <script>
    // Seiten-Navigation Dots & Scroll-to-Top
    const chapters = Array.from(document.querySelectorAll('.chapter, .page-section, footer'));
    const dots = document.querySelectorAll('.nav-dot');
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');

    const updateChapterState = (index) => {
      dots.forEach(dot => dot.classList.remove('active'));
      if (dots[index]) {
        dots[index].classList.add('active');
      }
    };

    const updateActiveDot = () => {
      const scrollPos = window.scrollY + window.innerHeight * 0.4;
      let activeIndex = 0;
      chapters.forEach((section, i) => {
        if (section.offsetTop <= scrollPos) {
          activeIndex = i;
        }
      });
      updateChapterState(activeIndex);
    };

    window.addEventListener('scroll', updateActiveDot);
    window.addEventListener('resize', updateActiveDot);
    updateActiveDot();

    if (scrollToTopBtn) {
      window.addEventListener('scroll', () => {
        scrollToTopBtn.classList.toggle('visible', window.scrollY > window.innerHeight * 0.5);
      });

      scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        if (chapters[index]) {
          chapters[index].scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Dynamisches Rendern der Preisliste bei Sprachwechsel
    async function renderPriceTable() {
      const lang = localStorage.getItem('lang') || 'de';
      try {
        const response = await fetch(`lang/${lang}.json`);
        const translations = await response.json();
        const priceTableBody = document.getElementById('priceTableBody');

        if (priceTableBody && translations.atelier?.priceItems) {
          priceTableBody.innerHTML = '';
          translations.atelier.priceItems.forEach(item => {
            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.textContent = item.name || '';
            const priceCell = document.createElement('td');
            priceCell.textContent = item.price || '';
            row.appendChild(nameCell);
            row.appendChild(priceCell);
            priceTableBody.appendChild(row);
          });
        }
      } catch (err) {
        console.error('Fehler beim Laden der Preisliste:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPriceTable();

      const langSwitcher = document.getElementById('lang-switcher');
      if (langSwitcher) {
        langSwitcher.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') {
            setTimeout(renderPriceTable, 50);
          }
        });
      }
    });
  </script>
</body>
</html>
