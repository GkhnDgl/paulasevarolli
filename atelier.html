<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title data-i18n="meta.title"></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/nav-loader.js" defer></script>
</head>
<body class="fixed-image-layout">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left"></div>
    <div class="nav-right"></div>
  </nav>

  <!-- Seiten-Navigation Dots -->
  <div class="chapter-nav">
    <div class="nav-dot active"></div>
    <div class="nav-dot"></div>
  </div>

  <section class="chapter">
    <div class="chapter-image-container">
      <img src="images/atelier.jpg" alt="Atelier" class="chapter-image">
    </div>
    <div class="chapter-content">
      <p class="chapter-eyebrow" data-i18n="atelier.eyebrow"></p>
      <h1 class="chapter-title" data-i18n="atelier.title"></h1>
      <p class="chapter-text" data-i18n="atelier.description"></p>
    </div>
  </section>

  <section class="page-section">
    <h2 data-i18n="atelier.priceListTitle"></h2>
    <table class="price-table">
      <thead>
        <tr>
          <th data-i18n="atelier.priceTableHeadService"></th>
          <th data-i18n="atelier.priceTableHeadPrice"></th>
        </tr>
      </thead>
      <tbody id="priceTableBody">
        <!-- Wird dynamisch per JavaScript befüllt -->
      </tbody>
    </table>
    <p class="price-note" data-i18n="atelier.priceListNote"></p>

    <div class="hero-actions">
      <a href="contact.html" class="btn" data-i18n="servicePages.cta">Termin vereinbaren</a>
    </div>
  </section>

  <button type="button" class="nav-icon-btn scroll-to-top-btn" id="scrollToTopBtn" aria-label="Nach oben scrollen" title="Nach oben">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 7.2 5.8 13.4 7.2 14.8 12 10 16.8 14.8 18.2 13.4 12 7.2Z"/>
    </svg>
  </button>

  <footer>
    <p data-i18n="footer"></p>
    <div class="footer-links">
      <a href="impressum.html" data-i18n="legal.footerImpressum"></a>
      <span class="divider-dot" aria-hidden="true">·</span>
      <a href="datenschutz.html" data-i18n="legal.footerDatenschutz"></a>
    </div>
  </footer>

  <script>
    // Seiten-Navigation Dots & Scroll-to-Top
    const chapters = Array.from(document.querySelectorAll('.chapter, .page-section, footer'));
    const dots = document.querySelectorAll('.nav-dot');
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');

    const updateChapterState = (index) => {
      dots.forEach(dot => dot.classList.remove('active'));
      if (dots[index]) {
        dots[index].classList.add('active');
      }
    };

    const updateActiveDot = () => {
      const scrollPos = window.scrollY + window.innerHeight * 0.4;
      let activeIndex = 0;
      chapters.forEach((section, i) => {
        if (section.offsetTop <= scrollPos) {
          activeIndex = i;
        }
      });
      updateChapterState(activeIndex);
    };

    window.addEventListener('scroll', updateActiveDot);
    window.addEventListener('resize', updateActiveDot);
    updateActiveDot();

    if (scrollToTopBtn) {
      window.addEventListener('scroll', () => {
        scrollToTopBtn.classList.toggle('visible', window.scrollY > window.innerHeight * 0.5);
      });

      scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        if (chapters[index]) {
          chapters[index].scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Dynamisches Rendern der Preisliste bei Sprachwechsel
    async function renderPriceTable() {
      const lang = localStorage.getItem('lang') || 'de';
      try {
        const response = await fetch(`lang/${lang}.json`);
        const translations = await response.json();
        const priceTableBody = document.getElementById('priceTableBody');

        if (priceTableBody && translations.atelier?.priceItems) {
          priceTableBody.innerHTML = '';
          translations.atelier.priceItems.forEach(item => {
            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.textContent = item.name || '';
            const priceCell = document.createElement('td');
            priceCell.textContent = item.price || '';
            row.appendChild(nameCell);
            row.appendChild(priceCell);
            priceTableBody.appendChild(row);
          });
        }
      } catch (err) {
        console.error('Fehler beim Laden der Preisliste:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPriceTable();

      const langSwitcher = document.getElementById('lang-switcher');
      if (langSwitcher) {
        langSwitcher.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') {
            setTimeout(renderPriceTable, 50);
          }
        });
      }
    });
  </script>
</body>
</html>
